services:
  - type: web
    name: subject-bank
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn subject_bank.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "subject_bank_db"
